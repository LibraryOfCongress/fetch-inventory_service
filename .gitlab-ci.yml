stages:
  - test
  - build
  - build_deploy_prod
  - trigger
  - deploy
  - controls
  - sonarqube

# Manual "build any branch for any target" control. On the Run Pipeline screen
# (CI/CD > Pipelines > Run pipeline) pick a branch, then choose a target here;
# GitLab renders this as a dropdown. The matching build_image_<target> (and
# deploy_<target>) jobs then appear as manual ▶ buttons in the pipeline.
# Leave on "none" for normal pushes/MRs (no build/deploy jobs are added).
variables:
  DEPLOY_TARGET:
    value: "none"
    options:
      - "none"
      - "dev"
      - "test"
      - "stage"
      - "prod"
    description: "Manual build/deploy target for the selected branch (none = no deploy build)."

# Run the pytest suite automatically on every merge request. Mirrors the env
# contract of docker-compose.test.yml (the local runner) but uses a native
# GitLab `postgres` service instead of DinD + bind mounts, which don't survive
# the DinD daemon boundary. conftest.py (TESTS_USE_EXTERNAL_DB=1) waits for the
# service, creates the DB if needed, runs `alembic upgrade head`, then tests.
test_mr:
  stage: test
  image: python:3.11.4-slim
  services:
    - name: postgres:15
      alias: test_db
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: test_database
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - poetry.lock
    paths:
      - .cache/pip
  before_script:
    # The app-facing env (DB URLs, secret) is exported here rather than under
    # `variables:` on purpose. GitLab UI-defined project/group CI/CD variables
    # OUTRANK .gitlab-ci.yml `variables:`, and this project defines names like
    # TEST_DATABASE_URL whose values are full `KEY=value` env-file lines (the
    # build jobs `echo $TEST_DATABASE_URL >> .env`), which aren't valid
    # SQLAlchemy URLs. Exporting in the job shell wins over those, so conftest /
    # pydantic-settings read the test DB and not an inherited env-file line.
    - export DATABASE_URL="postgresql://postgres:postgres@test_db:5432/test_database"
    - export TEST_DATABASE_URL="$DATABASE_URL"
    - export MIGRATION_URL="$DATABASE_URL"
    - export JWT_SECRET_KEY="test-secret"
    - export APP_ENVIRONMENT="test"
    - export TESTS_USE_EXTERNAL_DB="1"
    - export PYTHONPATH="$CI_PROJECT_DIR"
    # Export deps the same way the Containerfiles do (deps only, not the root
    # package — its setuptools-scm build needs git tags we don't have here).
    - pip install poetry==1.6.1
    - poetry export -f requirements.txt --output requirements.txt --without-hashes
    - pip install -r requirements.txt
  script:
    - pytest tests -ra --junitxml=tests/reports/junit.xml
  artifacts:
    when: always
    reports:
      junit: tests/reports/junit.xml
    paths:
      - tests/reports/junit.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build_image_dev:
  stage: build
  image: docker:latest
  services:
    - docker:29.6.2-dind
  variables:
    IMAGE_FULL_TAG: $CI_REGISTRY_IMAGE:latest
  script:
    - echo IMAGE_FULL_TAG $IMAGE_FULL_TAG
    - cp -v images/api.dev.Containerfile Dockerfile
    - echo $DEVELOP_APP_NAME > .env
    - echo $DEVELOP_APP_ENVIRONMENT >> .env
    - echo $DEVELOP_IDP_ENTITY_ID >> .env
    - echo $DEVELOP_IDP_LOGIN_URL >> .env
    - echo $DEVELOP_VUE_HOST >> .env
    - echo $DEVELOP_TIMEZONE >> .env
    - echo $DEVELOP_DATABASE_URL >> .env
    - echo $DEVELOP_MIGRATION_URL >> .env
    - echo $DEVELOP_ENABLE_ORM_SQL_LOGGING >> .env
    - echo $DEVELOP_ALLOWED_ORIGINS_REGEX >> .env
    - echo $DEVELOP_ALLOWED_ORIGINS >> .env
    - echo $DEVELOP_JWT_SECRET_KEY >> .env
    - echo "COMMIT=$CI_COMMIT_SHORT_SHA" >> .env
    - echo "BRANCH=$CI_COMMIT_BRANCH" >> .env
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --no-cache -t $IMAGE_FULL_TAG -f Dockerfile .
    - docker push $IMAGE_FULL_TAG
  rules:
    # Manual dev build for ANY branch: set DEPLOY_TARGET=dev on Run pipeline.
    - if: '$DEPLOY_TARGET == "dev"'
      when: manual
      allow_failure: true
    - when: never

