    - docker build --no-cache -t $IMAGE_FULL_TAG -f Dockerfile .
    - docker push $IMAGE_FULL_TAG
  rules:
    # Manual prod build for ANY branch via the dropdown...
    - if: '$DEPLOY_TARGET == "prod"'
      when: manual
    # ...plus the main-branch build (manual), same shape as staging.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy_dev:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: ['']
  environment:
    name: develop
    url: https://inventory.dev.fetch.example.com/status/
  script:
    - kubectl config use-context fetch/build:fetch
    - kubectl -n fetch apply -f k8s/deployment-dev.yml
    - kubectl -n fetch apply -f k8s/service.yml
    - sleep 10
    - kubectl -n fetch rollout restart deployment/inventory-service
    - kubectl -n fetch rollout status deployment/inventory-service --timeout=120s
  rules:
    # Manual dev deploy for ANY branch: set DEPLOY_TARGET=dev (run build_image_dev first).
    - if: '$DEPLOY_TARGET == "dev"'
      when: manual
    - when: never

deploy_demo:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: ['']
  script:
    - kubectl config use-context fetch/build:fetch
    - kubectl -n fetch apply -f k8s/deployment-demo.yml
    - kubectl -n fetch apply -f k8s/service.yml
    - sleep 10
    - kubectl -n fetch rollout restart deployment/inventory-service
    - kubectl -n fetch rollout status deployment/inventory-service --timeout=120s
  rules:
    - if: '$DEMO_BUILD =~ /^TRUE$/'
      when: manual
    - when: never

deploy_test:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: ['']
  environment:
    name: test
    url: https://inventory.test.fetch.example.com/status/
  script:
    - kubectl config use-context fetch/build:fetch-test -v=6
    - kubectl -n fetch apply -f k8s/deployment-test.yml
    - kubectl -n fetch apply -f k8s/service.yml
    - sleep 10
    - kubectl -n fetch rollout restart deployment/inventory-service
    - kubectl -n fetch rollout status deployment/inventory-service --timeout=120s
  rules:
    # Manual test deploy for ANY branch via the dropdown...
    - if: '$DEPLOY_TARGET == "test"'
      when: manual
    # ...plus the existing develop test deploy (manual).
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: manual

deploy_stage:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: ['']
  environment:
    name: staging
    url: https://inventory.stage.fetch.example.com/status/
  script:
    - kubectl config use-context fetch/build:fetch-stage -v=6
    - kubectl -n fetch apply -f k8s/deployment-stage.yml
    - kubectl -n fetch apply -f k8s/service.yml
    - sleep 10
    - kubectl -n fetch rollout restart deployment/inventory-service
    - kubectl -n fetch rollout status deployment/inventory-service --timeout=120s
  rules:
    # Manual stage deploy for ANY branch via the dropdown...
    - if: '$DEPLOY_TARGET == "stage"'
      when: manual
    # ...plus the existing staging-branch deploy.
    - if: $CI_COMMIT_BRANCH == 'staging'
      when: manual

deploy_prod:
  stage: build_deploy_prod
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  environment:
    name: prod
    url: https://inventory.fetch.example.com/status/
  script:
    - kubectl config use-context fetch/build:fetch-prod -v=6
    - kubectl -n fetch apply -f k8s/deployment-prod.yml
    - kubectl -n fetch apply -f k8s/service.yml
    - sleep 10
    - kubectl -n fetch rollout restart deployment/inventory-service
    - kubectl -n fetch rollout status deployment/inventory-service --timeout=120s
  rules:
    # Manual prod deploy for ANY branch via the dropdown...
    - if: '$DEPLOY_TARGET == "prod"'
      when: manual
    # ...plus the main-branch deploy (manual), same shape as staging.
    - if: $CI_COMMIT_BRANCH == 'main'
      when: manual

sonarqube_run:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    - sonar-scanner
      -Dsonar.projectKey=fetch-inventory-service
      -Dsonar.sources=.
      -Dsonar.host.url=http://example.com:80
      -Dsonar.login=$DEV_SONARQUBE_TOKEN
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
    - when: never
