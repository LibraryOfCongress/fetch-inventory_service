    - echo $PROD_IDP_LOGIN_URL >> .env
    - echo $PROD_VUE_HOST >> .env
    - echo $PROD_DATABASE_URL >> .env
    - echo $PROD_MIGRATION_URL >> .env
    - echo $PROD_ENABLE_ORM_SQL_LOGGING >> .env
